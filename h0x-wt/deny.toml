# cargo deny check licenses bans sources, for the h0x-wt workspace (a modified copy of
# worktrunk, shipped as h0x-core-tools/h0x-wt). Advisories stay with core's own deny run.

[graph]
all-features = true

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0", # clipboard-win, error-code (Boost: permissive, no notice duty in binaries)
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true # our own crates

[sources]
unknown-registry = "deny"
unknown-git = "deny"
